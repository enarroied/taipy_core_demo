[project]
name = "taipy-core-demo"
version = "0.1.1"
description = "A Taipy app that shows the basics of Taipy Scenario Management pipelines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "taipy>=4.1.1",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]
[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
